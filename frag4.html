function sL(){
const L=$('lS').value;
document.querySelectorAll('button,h1,h2,h3').forEach(el=>{
const t=el.textContent.trim();
if(el.dataset.orig===undefined)el.dataset.orig=t;
const src=el.dataset.orig;
if(L==='it'){if(el.dataset.t!==undefined){el.textContent=el.dataset.t;}}
else{const tr=DICT[L][src];if(tr){if(el.dataset.t===undefined)el.dataset.t=t;el.textContent=tr;}}
});
}
